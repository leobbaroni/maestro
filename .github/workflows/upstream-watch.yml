name: Upstream watch

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check upstreams
        id: drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e -o pipefail
          node scripts/check-upstreams.mjs | tee report.txt
          echo "drifted=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update drift issue
        if: steps.drift.outputs.drifted != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream drift: sources changed since last distillation"
          body="$(printf 'The weekly upstream check found changes in maestro'"'"'s source repos.\n\n```\n%s\n```\n\nFollow [UPDATING.md](../blob/main/UPDATING.md) to re-distill the affected modules, then run `node scripts/check-upstreams.mjs --pin` and commit the new pins.' "$(cat report.txt)")"
          existing=$(gh issue list --state open --search "in:title \"Upstream drift\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
